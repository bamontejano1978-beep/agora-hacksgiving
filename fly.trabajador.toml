# fly deploy -c fly.trabajador.toml
app = "agora-trabajador"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    APP = "trabajador"

[env]
  PORT = "8080"
  URL_TESTIGO = "http://agora-testigo.internal:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.salud]
      interval = "15s"
      timeout = "3s"
      grace_period = "10s"
      method = "GET"
      path = "/salud"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# El estado vive en un JSON: una sola máquina.
#   fly volumes create agora_datos --size 1 -r mad
#   fly deploy -c fly.testigo.toml --ha=false
app = "agora-testigo"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    APP = "testigo"

[env]
  PORT = "8080"
  JOBS_FILE = "/data/jobs.json"
  WHOIS_ACTIVO = "true"

[mounts]
  source = "agora_datos"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.salud]
      interval = "15s"
      timeout = "3s"
      grace_period = "10s"
      method = "GET"
      path = "/salud"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
